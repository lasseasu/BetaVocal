name: Build Windows VST3

on:
  push:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Clone JUCE
        run: git clone --depth 1 --branch 7.0.12 https://github.com/juce-framework/JUCE.git

      - name: Prepare Source and CMakeLists
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "Source" -Force | Out-Null
          $files = Get-ChildItem -Path "." -Recurse -File | Where-Object {
            $_.Name -in @("PluginProcessor.cpp", "PluginProcessor.h", "PluginEditor.cpp", "PluginEditor.h") -and $_.FullName -notmatch "\\JUCE\\"
          }
          foreach ($f in $files) {
            if ($f.DirectoryName -ne (Resolve-Path "Source").Path) {
              Copy-Item -Path $f.FullName -Destination "Source/" -Force
            }
          }
          if (-not (Test-Path "Source/PluginProcessor.cpp")) {
            Write-Error "Kooditiedostoja (PluginProcessor.cpp jne.) ei loytynyt projektista! Lataa ne Code-valilehdella."
            exit 1
          }
          $cmakeLines = @(
            'cmake_minimum_required(VERSION 3.22)',
            'cmake_policy(SET CMP0091 NEW)',
            'project(BetaVocal VERSION 1.0.0)',
            'set(CMAKE_CXX_STANDARD 17)',
            'set(CMAKE_CXX_STANDARD_REQUIRED ON)',
            'set(CMAKE_MSVC_RUNTIME_LIBRARY "MultiThreaded$<$<CONFIG:Debug>:Debug>")',
            'add_compile_options($<$<COMPILE_LANGUAGE:CXX>:/FIchrono> /EHsc)',
            'add_subdirectory(JUCE)',
            'juce_add_plugin(BetaVocal',
            '    COMPANY_NAME "CustomAudio"',
            '    IS_SYNTH FALSE',
            '    NEEDS_MIDI_INPUT FALSE',
            '    NEEDS_MIDI_OUTPUT FALSE',
            '    IS_MIDI_EFFECT FALSE',
            '    COPY_PLUGIN_AFTER_BUILD FALSE',
            '    PLUGIN_MANUFACTURER_CODE Cstm',
            '    PLUGIN_CODE Btv1',
            '    FORMATS VST3',
            '    PRODUCT_NAME "BetaVocal")',
            'juce_generate_juce_header(BetaVocal)',
            'target_sources(BetaVocal PRIVATE',
            '    Source/PluginProcessor.cpp',
            '    Source/PluginProcessor.h',
            '    Source/PluginEditor.cpp',
            '    Source/PluginEditor.h)',
            'target_compile_definitions(BetaVocal PUBLIC',
            '    JUCE_WEB_BROWSER=0',
            '    JUCE_USE_CURL=0',
            '    JUCE_VST3_CAN_REPLACE_VST2=0)',
            'target_link_libraries(BetaVocal',
            '    PRIVATE',
            '        juce::juce_audio_utils',
            '        juce::juce_dsp',
            '    PUBLIC',
            '        juce::juce_recommended_config_flags',
            '        juce::juce_recommended_warning_flags)'
          )
          $cmakeLines | Set-Content -Path "CMakeLists.txt" -Encoding UTF8

      - name: Build VST3 (64-bit Release)
        run: |
          cmake -B build -A x64
          cmake --build build --config Release

      - name: Package VST3
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "dist/BetaVocal.vst3" -Force | Out-Null
          $vst3 = Get-ChildItem -Path "build" -Recurse -Directory -Filter "BetaVocal.vst3" | Select-Object -First 1
          if ($null -eq $vst3) {
            Write-Error "BetaVocal.vst3 ei loytynyt build-kansiosta!"
            exit 1
          }
          Copy-Item -Path "$($vst3.FullName)/*" -Destination "dist/BetaVocal.vst3/" -Recurse -Force

      - name: Upload Windows VST3
        uses: actions/upload-artifact@v4
        with:
          name: BetaVocal-Windows-VST3
          path: dist/
